<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawa Tran - Portfolio | GIS Specialist & Geographer</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicons/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    
    <script src="//unpkg.com/globe.gl"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html { 
            height: 100vh;
            width: 100vw;
            background: #000000;
            font-family: "Space Mono", monospace;
            font-weight: 700;
            overflow: hidden;
            cursor: default;
        }

        #globeViz {
            width: 100vw; 
            height: 100vh;
            position: fixed; 
            top: 0; 
            left: 0;
            z-index: 1;
        }

        /* Stars Background */
        .stars {
            position: fixed;
            width: 100%;
            height: 100vh;
            top: 0;
            left: 0;
            background: transparent;
            z-index: 0;
            overflow: hidden;
        }

        .star-layer {
            position: absolute;
            width: 1px;
            height: 1px;
            background: transparent;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            30% { opacity: 0.2; }
            70% { opacity: 0.7; }
        }

        #stars1 .star-layer { animation: twinkle 1s linear infinite; }
        #stars2 .star-layer { animation: twinkle 1.5s linear infinite; }
        #stars3 .star-layer { animation: twinkle 2s linear infinite; }

        /* ========== MAP MARKERS ========== */
        .map-marker {
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.25s ease;
        }

        /* Le pin marker (toujours visible) */
        .marker-pin {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .marker-pin svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        /* Pulsing effect on marker */
        .marker-pin::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0;
            animation: markerPulse 2s ease-out infinite;
        }

        @keyframes markerPulse {
            0% { transform: scale(0.5); opacity: 0.4; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* Le popup qui apparaît au hover */
        .marker-popup {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .marker-popup-content {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .marker-popup-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(139, 211, 244, 0.2);
            border: 1px solid rgba(139, 211, 244, 0.4);
        }

        .marker-popup-icon svg {
            width: 18px;
            height: 18px;
            fill: #8fd3f4;
        }

        .marker-popup-label {
            font-family: "Space Mono", monospace;
            font-size: 0.8rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .marker-popup-arrow {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid rgba(0, 0, 0, 0.85);
        }

        /* Hover state - show popup */
        .map-marker:hover .marker-popup {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .map-marker:hover .marker-pin {
            transform: scale(1.3);
        }

        .map-marker:hover .marker-pin svg {
            filter: drop-shadow(0 0 15px currentColor);
        }

        /* Color themes */
        .map-marker.blue { color: #8fd3f4; }
        .map-marker.red { color: #ff6b6b; }

        .map-marker.red .marker-popup-icon {
            background: rgba(255, 100, 100, 0.2);
            border-color: rgba(255, 100, 100, 0.4);
        }

        .map-marker.red .marker-popup-icon svg {
            fill: #ff6b6b;
        }

        .map-marker.red .marker-popup-content {
            border-color: rgba(255, 100, 100, 0.3);
        }

        /* Center text */
        .center-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            animation: fadeInCenter 1s ease 0.5s forwards;
        }

        @keyframes fadeInCenter {
            to { opacity: 1; }
        }

        .center-text h1 {
            color: white;
            font-size: 1.8rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(139, 211, 244, 0.5), 0 0 60px rgba(0,0,0,0.8);
        }

        .center-text p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* ========== NAVIGATION CONTROLS ========== */
        .nav-controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            border-color: #8fd3f4;
            background: rgba(139, 211, 244, 0.2);
            box-shadow: 0 0 20px rgba(139, 211, 244, 0.4);
            transform: scale(1.1);
        }

        .nav-btn:hover svg {
            fill: #8fd3f4;
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-current {
            min-width: 180px;
            padding: 15px 25px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-current:hover {
            border-color: #8fd3f4;
            background: rgba(139, 211, 244, 0.15);
            box-shadow: 0 0 30px rgba(139, 211, 244, 0.3);
        }

        .nav-current.special {
            border-color: rgba(255, 100, 100, 0.4);
        }

        .nav-current.special:hover {
            border-color: #ff6b6b;
            background: rgba(255, 100, 100, 0.15);
            box-shadow: 0 0 30px rgba(255, 100, 100, 0.3);
        }

        .nav-label {
            display: block;
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }

        .nav-current:hover .nav-label {
            color: #8fd3f4;
        }

        .nav-current.special .nav-label {
            color: #ff6b6b;
        }

        .nav-hint {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Dots indicator */
        .nav-dots {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 12px;
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-dot:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .nav-dot.active {
            background: #8fd3f4;
            box-shadow: 0 0 10px rgba(139, 211, 244, 0.6);
            transform: scale(1.3);
        }

        .nav-dot.special.active {
            background: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 100, 100, 0.6);
        }

        /* Pop-up Overlay */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .popup-content {
            padding: 50px 70px;
            border-radius: 15px;
            text-align: center;
            position: relative;
            transform: scale(0.7);
            transition: transform 0.3s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.4);
        }

        .popup-content h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
            font-size: 1.5rem;
            letter-spacing: 3px;
        }

        .popup-content p {
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: rgba(255,255,255,0.6);
            transition: all 0.3s ease;
        }

        .close:hover {
            color: #ff6b6b;
            transform: rotate(90deg);
        }

        .popup-overlay.show {
            display: flex;
            opacity: 1;
        }

        .popup-overlay.show .popup-content {
            transform: scale(1);
        }

        /* ========== RESPONSIVE ========== */
        @media only screen and (max-width: 768px) {
            .marker-pin {
                width: 18px;
                height: 18px;
            }

            .marker-popup-content {
                padding: 8px 12px;
                gap: 6px;
            }

            .marker-popup-icon {
                width: 24px;
                height: 24px;
            }

            .marker-popup-icon svg {
                width: 12px;
                height: 12px;
            }

            .marker-popup-label {
                font-size: 0.6rem;
                letter-spacing: 1px;
            }

            .center-text h1 {
                font-size: 1.2rem;
                letter-spacing: 5px;
            }

            .center-text p {
                font-size: 0.6rem;
                letter-spacing: 2px;
            }

            /* Navigation controls mobile */
            .nav-controls {
                bottom: 100px;
                gap: 10px;
            }

            .nav-btn {
                width: 44px;
                height: 44px;
            }

            .nav-btn svg {
                width: 20px;
                height: 20px;
            }

            .nav-current {
                min-width: 140px;
                padding: 12px 18px;
            }

            .nav-label {
                font-size: 0.75rem;
                letter-spacing: 1px;
            }

            .nav-hint {
                font-size: 0.55rem;
            }

            .nav-dots {
                bottom: 60px;
                gap: 10px;
            }

            .nav-dot {
                width: 10px;
                height: 10px;
            }
        }

        /* ========== LOADER ========== */
        .loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(#000000 0%, #1a1a4e 50%, #2cb5e8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        } 

        .loader-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .loader-spinner {
            width: 140px;
            height: 140px;
            position: relative;
            animation: float 3s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .globe-loader {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a4e 0%, #2cb5e8 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 20px rgba(139, 211, 244, 0.4),
                inset 0 -30px 40px rgba(0, 0, 0, 0.3),
                inset 20px 0 40px rgba(139, 211, 244, 0.1);
            animation: globeSpin 4s linear infinite;
        }

        @keyframes globeSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .globe-loader::before,
        .globe-loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(139, 211, 244, 0.4);
        }

        .globe-loader::before {
            width: 30px;
            height: 22px;
            top: 18%;
            left: 12%;
            border-radius: 50% 20% 40% 30%;
            animation: pulse 2s ease-in-out infinite;
        }

        .globe-loader::after {
            width: 24px;
            height: 28px;
            bottom: 22%;
            right: 18%;
            border-radius: 30% 50% 20% 45%;
            animation: pulse 2s ease-in-out infinite 1s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        .continent {
            position: absolute;
            background: rgba(139, 211, 244, 0.25);
            border-radius: 50%;
        }

        .continent:nth-child(1) {
            width: 22px;
            height: 18px;
            top: 50%;
            left: 10%;
            border-radius: 40% 60% 50% 50%;
        }

        .continent:nth-child(2) {
            width: 18px;
            height: 24px;
            top: 15%;
            right: 25%;
            border-radius: 50% 50% 30% 70%;
        }

        .continent:nth-child(3) {
            width: 15px;
            height: 15px;
            bottom: 20%;
            left: 30%;
            border-radius: 60% 40% 50% 50%;
        }

        .loader-stars {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 4px white;
            animation: twinkleLoader 1.5s ease-in-out infinite;
        }

        @keyframes twinkleLoader {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .loader-stars:nth-child(2) { top: 5px; left: 20px; animation-delay: 0s; }
        .loader-stars:nth-child(3) { top: 25px; right: 10px; animation-delay: 0.5s; }
        .loader-stars:nth-child(4) { bottom: 20px; left: 5px; animation-delay: 1s; }
        .loader-stars:nth-child(5) { bottom: 10px; right: 18px; animation-delay: 1.5s; }

        .loader-text {
            color: white;
            font-family: "Space Mono", monospace;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(139, 211, 244, 0.5);
        }

        .loader-bar-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            background: linear-gradient(90deg, #2cb5e8, #8fd3f4, #FFD700);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .loader-percentage {
            color: #8fd3f4;
            font-family: "Space Mono", monospace;
            font-size: 0.9rem;
            font-weight: 700;
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // ========== STARS CREATION ==========
        function createStars(layerId, numStars, starSize, minTwinkleTime, maxTwinkleTime) {
            const starsContainer = document.getElementById(layerId);
            
            for (let i = 0; i < numStars; i++) {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;

                const starElement = document.createElement('div');
                starElement.classList.add('star-layer');
                starElement.style.width = `${starSize}px`;
                starElement.style.height = `${starSize}px`;
                starElement.style.backgroundColor = '#FFF';
                starElement.style.position = 'absolute';
                starElement.style.top = `${y}px`;
                starElement.style.left = `${x}px`;

                const twinkleDuration = Math.random() * (maxTwinkleTime - minTwinkleTime) + minTwinkleTime;
                const twinkleDelay = Math.random() * twinkleDuration;
                starElement.style.animationDuration = `${twinkleDuration}s`;
                starElement.style.animationDelay = `${twinkleDelay}s`;

                starsContainer.appendChild(starElement);
            }
        }

        createStars('stars1', 30, 1, 0.5, 2);
        createStars('stars2', 25, 2, 1, 3);
        createStars('stars3', 20, 3, 1.5, 4);
    </script>

                label: 'Compétences',
                href: 'page1.html',
                icon: `<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>`,
                color: 'blue'
            },
            {
                lat: 45.5017,   // Montréal
                lng: -73.5673,
                label: 'Work Gallery',
                href: 'page3.html',
                icon: `<svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>`,
                color: 'blue'
            },
            {
                lat: 32.0853,   // Tel Aviv
                lng: 34.7818,
                label: 'Mapsterpieces',
                href: '#popup',
                icon: `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
                color: 'red'
            }
        ];

        // ========== GLOBE INITIALIZATION ==========
        const world = Globe()
            .globeImageUrl('textures/WEBP/HD/EARTH.webp')
            .bumpImageUrl('textures/WEBP/HD/BUMP.webp')
            .backgroundColor('rgba(0, 0, 0, 0)')
            .htmlElementsData(navData)
            .htmlElement(d => {
                const el = document.createElement('div');
                el.className = `map-marker ${d.color}`;
                el.innerHTML = `
                    <div class="marker-pin">
                        ${pinSvg}
                    </div>
                    <div class="marker-popup">
                        <div class="marker-popup-content">
                            <div class="marker-popup-icon">
                                ${d.icon}
                            </div>
                            <span class="marker-popup-label">${d.label}</span>
                        </div>
                        <div class="marker-popup-arrow"></div>
                    </div>
                `;
                
                el.style.pointerEvents = 'auto';
                el.style.cursor = 'pointer';
                
                el.onclick = () => {
                    if (d.href === '#popup') {
                        const popup = document.getElementById('popup');
                        popup.style.display = 'flex';
                        setTimeout(() => popup.classList.add('show'), 10);
                    } else {
                        window.location.href = d.href;
                    }
                };
                
                return el;
            })
            .htmlLat(d => d.lat)
            .htmlLng(d => d.lng)
            .htmlAltitude(0.01)
            .htmlTransitionDuration(0)
            (document.getElementById('globeViz'));

        // Visibility modifier - fade when behind globe
        world.htmlElementVisibilityModifier((el, isVisible) => {
            el.style.opacity = isVisible ? 1 : 0;
        });

        // Customize globe material
        const globeMaterial = world.globeMaterial();
        globeMaterial.bumpScale = 50;
        new THREE.TextureLoader().load('textures/WEBP/HD/EAU.webp', texture => {
            globeMaterial.specularMap = texture;
            globeMaterial.specular = new THREE.Color('grey');
            globeMaterial.shininess = 50;
        });

        const directionalLight = world.lights().find(light => light.type === 'DirectionalLight');
        directionalLight && directionalLight.position.set(10, 100, 10);

        // Controls
        world.controls().enableZoom = false;
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // Camera settings
        function updateCameraZoom() {
            if (window.innerWidth <= 768) {
                world.camera().fov = 75;
            } else {
                world.camera().fov = 50;
            }
            world.camera().updateProjectionMatrix();
        }

        updateCameraZoom();
        window.addEventListener('resize', updateCameraZoom);

        function updateGlobeSize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            world.width(width).height(height);
        }

        updateGlobeSize();
        window.addEventListener('resize', updateGlobeSize);

        // Slow rotation on hover
        const globeContainer = document.getElementById('globeViz');
        globeContainer.addEventListener('mouseenter', () => {
            world.controls().autoRotateSpeed = 0.2;
        });
        globeContainer.addEventListener('mouseleave', () => {
            world.controls().autoRotateSpeed = 0.5;
        });

        // ========== NAVIGATION CONTROLS ==========
        let currentIndex = 0;
        const navCurrent = document.getElementById('navCurrent');
        const navLabel = navCurrent.querySelector('.nav-label');
        const navDots = document.querySelectorAll('.nav-dot');

        function updateNavUI() {
            const current = navData[currentIndex];
            
            // Update label
            navLabel.textContent = current.label;
            
            // Update special class
            if (current.color === 'red') {
                navCurrent.classList.add('special');
            } else {
                navCurrent.classList.remove('special');
            }
            
            // Update dots
            navDots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function goToDestination(index) {
            currentIndex = index;
            const dest = navData[currentIndex];
            
            // Stop auto-rotation temporarily
            world.controls().autoRotate = false;
            
            // Fly to destination
            world.pointOfView({
                lat: dest.lat,
                lng: dest.lng,
                altitude: 2.5
            }, 1000);
            
            // Resume auto-rotation after animation
            setTimeout(() => {
                world.controls().autoRotate = true;
                world.controls().autoRotateSpeed = 0.3;
            }, 1200);
            
            updateNavUI();
        }

        function nextDestination() {
            const newIndex = (currentIndex + 1) % navData.length;
            goToDestination(newIndex);
        }

        function prevDestination() {
            const newIndex = (currentIndex - 1 + navData.length) % navData.length;
            goToDestination(newIndex);
        }

        function visitCurrentDestination() {
            const current = navData[currentIndex];
            if (current.href === '#popup') {
                const popup = document.getElementById('popup');
                popup.style.display = 'flex';
                setTimeout(() => popup.classList.add('show'), 10);
            } else {
                window.location.href = current.href;
            }
        }

        // Event listeners
        document.getElementById('navPrev').addEventListener('click', prevDestination);
        document.getElementById('navNext').addEventListener('click', nextDestination);
        navCurrent.addEventListener('click', visitCurrentDestination);

        // Dots click
        navDots.forEach((dot, i) => {
            dot.addEventListener('click', () => goToDestination(i));
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevDestination();
            if (e.key === 'ArrowRight') nextDestination();
            if (e.key === 'Enter') visitCurrentDestination();
        });

        // Swipe support for mobile
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe left -> next
                    nextDestination();
                } else {
                    // Swipe right -> previous
                    prevDestination();
                }
            }
        }

        // Initialize
        updateNavUI();
    </script>
    
    <script>
        // ========== POPUP HANDLING ==========
        document.getElementById('closePopup').addEventListener('click', function() {
            const popup = document.getElementById('popup');
            popup.classList.remove('show');
            setTimeout(function() {
                popup.style.display = 'none';
            }, 300);
        });

        window.addEventListener('click', function(event) {
            const popup = document.getElementById('popup');
            if (event.target === popup) {
                popup.classList.remove('show');
                setTimeout(function() {
                    popup.style.display = 'none';
                }, 300);
            }
        });
    </script>

    <script>
        // ========== PRELOADER ==========
        (function() {
            const loaderScreen = document.getElementById('loaderScreen');
            const loaderBar = document.getElementById('loaderBar');
            const loaderPercentage = document.getElementById('loaderPercentage');
            
            let loadedCount = 0;
            let totalCount = 0;
            
            const resourcesToPreload = [
                'textures/WEBP/HD/EARTH.webp',
                'textures/WEBP/HD/BUMP.webp',
                'textures/WEBP/HD/EAU.webp',
                'textures/WEBP/IT.webp',
                'textures/WEBP/MAPMOND.webp',
                'textures/WEBP/DATA.webp',
                'textures/MOI3.webp',
                'textures/MOICREEPY.webp',
                'page1.html',
                'page2.html',
                'page3.html',
                'works/Huntsterpieces/hunsterpiece_preview.png',
                'works/Bigfoot/images/preview.png',
                'works/LightHouse/LightHouses.png',
                'works/Lidar/Lidar_Gerardmer.png',
                'works/Innondations/5m.png'
            ];
            
            totalCount = resourcesToPreload.length;
            
            function updateProgress() {
                const percentage = Math.round((loadedCount / totalCount) * 100);
                loaderBar.style.width = percentage + '%';
                loaderPercentage.textContent = percentage + '%';
                
                if (loadedCount >= totalCount) {
                    setTimeout(() => {
                        loaderScreen.classList.add('hidden');
                    }, 500);
                }
            }
            
            function preloadImage(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedCount++;
                        updateProgress();
                        resolve();
                    };
                    img.onerror = () => {
                        loadedCount++;
                        updateProgress();
                        resolve();
                    };
                    img.src = url;
                });
            }
            
            function preloadHTML(url) {
                return fetch(url)
                    .then(() => {
                        loadedCount++;
                        updateProgress();
                    })
                    .catch(() => {
                        loadedCount++;
                        updateProgress();
                    });
            }
            
            Promise.all(resourcesToPreload.map(url => {
                if (url.endsWith('.html')) {
                    return preloadHTML(url);
                } else {
                    return preloadImage(url);
                }
            }));
            
            setTimeout(() => {
                if (!loaderScreen.classList.contains('hidden')) {
                    loaderScreen.classList.add('hidden');
                }
            }, 10000);
        })();
    </script>
</body>
